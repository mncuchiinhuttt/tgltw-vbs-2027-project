name: Build & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "deploy-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-vercel:
    name: Deploy to Vercel
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Method A: Trigger via Vercel Deploy Hook (Recommended - Simple & Fast)
      - name: Trigger Vercel Deploy Hook
        if: env.HAS_DEPLOY_HOOK == 'true'
        env:
          HAS_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK != '' }}
        run: |
          echo "Triggering Vercel Deploy Hook..."
          curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}" > /dev/null
          echo "Vercel Deploy Hook triggered successfully!"

      # Method B: Direct Vercel CLI Deploy (When VERCEL_TOKEN is set)
      - name: Setup Node.js for Vercel CLI
        if: env.HAS_VERCEL_TOKEN == 'true' && env.HAS_DEPLOY_HOOK != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI & Deploy
        if: env.HAS_VERCEL_TOKEN == 'true' && env.HAS_DEPLOY_HOOK != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          HAS_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK != '' }}
        run: |
          npm install -g vercel@latest
          npm ci
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

      - name: Notice if no Vercel secret configured
        if: secrets.VERCEL_DEPLOY_HOOK == '' && secrets.VERCEL_TOKEN == ''
        run: |
          echo "::notice title=Vercel Auto-Deploy Setup::To enable automatic Vercel deployment on every push from any user, add either 'VERCEL_DEPLOY_HOOK' or ('VERCEL_TOKEN', 'VERCEL_ORG_ID', 'VERCEL_PROJECT_ID') to GitHub Repository Secrets."

  deploy-github-pages:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
